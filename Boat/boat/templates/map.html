{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <title>Carte</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>

<body>
    <div id="game-container">
        <div id="game-hud">
            <div id="game-hud-bars">
                <div id="boisium-bar" class="resource-bar">
                    <div class="bar-icon" style="--bar-icon-color: #71593F;">
                        <img src="{% static 'assets/icons/wood.svg' %}" alt="Boisium" class="bar-icon-img">
                    </div>
                    <div class="bar-frame">
                        <img src="{% static 'assets/images/resource-bar-frame.png' %}" alt="Bar Frame"
                            class="bar-frame-img">
                        <div class="bar-frame-text">{{ data.resources.boisium }}</div>
                    </div>
                </div>
                <div id="feronium-bar" class="resource-bar">
                    <div class="bar-icon" style="--bar-icon-color: #B5B5B5;">
                        <img src="{% static 'assets/icons/ore.svg' %}" alt="Feronium" class="bar-icon-img">
                    </div>
                    <div class="bar-frame">
                        <img src="{% static 'assets/images/resource-bar-frame.png' %}" alt="Bar Frame"
                            class="bar-frame-img">
                        <div class="bar-frame-text">{{ data.resources.feronium }}</div>
                    </div>
                </div>
                <div id="charbonium-bar" class="resource-bar">
                    <div class="bar-icon" style="--bar-icon-color: #3A3D30;">
                        <img src="{% static 'assets/icons/ore-coal.svg' %}" alt="Charbonium" class="bar-icon-img">
                    </div>
                    <div class="bar-frame">
                        <img src="{% static 'assets/images/resource-bar-frame.png' %}" alt="Bar Frame"
                            class="bar-frame-img">
                        <div class="bar-frame-text">{{ data.resources.charbonium }}</div>
                    </div>
                </div>
                <div id="gold-bar" class="resource-bar">
                    <div class="bar-icon" style="--bar-icon-color: #DAC276;">
                        <img src="{% static 'assets/icons/gold.svg' %}" alt="Gold" class="bar-icon-img">
                    </div>
                    <div class="bar-frame">
                        <img src="{% static 'assets/images/resource-bar-frame.png' %}" alt="Bar Frame"
                            class="bar-frame-img">
                        <div class="bar-frame-text">{{ data.resources.gold }}</div>
                    </div>
                </div>
                <div id="boat-bar" class="boat-bar">
                    <div class="move-bar">
                        <div class="bar-icon" style="--bar-icon-color: #8F6978;">
                            <img src="{% static 'assets/icons/resource-icon.svg' %}" alt="Boat" class="bar-icon-img">
                        </div>
                        <div class="movement-bar-frame">
                            <img src="{% static 'assets/images/movement-bar.png' %}" alt="Bar Frame"
                                class="movement-bar-frame-img">
                            <div class="move-progress-background"></div>
                            <div id="move-progress" class="move-progress"
                                style="--move-progress: {{ data.boat.remainingMovement }} / {{ data.boat.maxMovement }};">
                            </div>
                            <div id="move-progress-text" class="move-progress-text">{{ data.boat.remainingMovement }} /
                                {{ data.boat.maxMovement }}</div>
                        </div>
                    </div>
                    <div class="level-bar">
                        <img src="{% static 'assets/images/boat-bar-frame.png' %}" alt="Level" class="level-img">
                        <div>
                            <div class="level-text">NIVEAU {{ data.boat.level }}</div>
                            <div class="info" onclick="showBoatInfo();"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="game-hud-buttons">
                <button id="market-button" class="btn btn-clear btn-icon-big btn-icon" onclick="showMarket();">
                    <img src="{% static 'assets/icons/cart.svg' %}" alt="Market">
                </button>
            </div>
        </div>
        <div id="game-map">
            <div id="map-container"></div>
        </div>
        <div id="game-menu" class="modal" style="display: none;">
            <div id="game-menu-content" class="modal-content">
                <button id="game-menu-exit" class="modal-exit exit" onclick="closeMenu();">
                    <img src="{% static 'assets/icons/close.svg' %}" alt="Close Menu" class="game-menu-exit-img">
                </button>
                <div id="game-menu-title">Menu</div>
                <div id="game-menu-choices">
                    <div class="game-menu-choice current-choice" data-callback="end">RETURN TO MENU</div>
                    <div class="game-menu-choice" data-callback="openOptions">OPTIONS</div>
                </div>
            </div>
        </div>
        <div id="market-modal" class="modal" style="display: none;">
            <div id="market-modal-content" class="modal-content">
                <div id="market-modal-title">
                    <div>Market Place</div>
                    <button id="market-modal-exit" class="exit" onclick="closeMarket();">
                        <img src="{% static 'assets/icons/close.svg' %}" alt="Close Menu" class="game-menu-exit-img">
                    </button>
                </div>
                <div id="market-content">
                    <div id="market-offers">
                        <div id="offers-pagination"></div>
                        <div id="offers-container"></div>
                    </div>
                    <button class="btn btn-primary btn-fill" onclick="showOffer();">Créer une offre</button>
                </div>
            </div>
        </div>
        <div id="offer-modal" class="modal" style="display: none;">
            <div id="offer-modal-content" class="modal-content">
                <button id="offer-modal-exit" class="modal-exit exit" onclick="closeOffer();">
                    <img src="{% static 'assets/icons/close.svg' %}" alt="Close Menu" class="game-menu-exit-img">
                </button>
                <div id="offer-modal-title">
                    <div>Créer une offre</div>
                </div>
                <div id="offer-content">
                    <form id="offer-form" class="form">
                        <div class="form-field">
                            <label for="offer-resource">Ressource:</label>
                            <select id="offer-resource" name="offer-resource">
                                <option value="boisium">Boisium</option>
                                <option value="feronium">Feronium</option>
                                <option value="charbonium">Charbonium</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-col form-field">
                                <label for="offer-quantity">Quantité:</label>
                                <input type="number" id="offer-quantity" name="offer-quantity" min="1" required>
                            </div>
                            <div class="form-col form-field">
                                <label for="offer-price">Prix par unité:</label>
                                <input type="number" id="offer-price" name="offer-price" min="1" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <button type="button" class="btn btn-primary btn-fill" onclick="submitOffer();">Créer
                                l'offre</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
<script type="module">
    import { boat } from "{% static 'js/boat.js' %}";
    console.log('init boat');
    boat.nextLevel();
</script>
<script type="module">
    import { map } from "{% static 'js/map.js' %}";
    map.init({{ data| safe }});
</script>
<script type="module">
    import hud from "{% static 'js/hud.js' %}";
    hud.init();
</script>
<script type="module" src="{% static 'js/market.js' %}"></script>
<script type="module">
    import move from "{% static 'js/move.js' %}";
    console.log('init');

    document.addEventListener('keydown', async (event) => {
        console.log(event);

        if (event.key == 'z') {
            await move.moveNext('N');
        } else if (event.key == 's') {
            await move.moveNext('S');
        } else if (event.key == 'q') {
            await move.moveNext('W');
        } else if (event.key == 'd') {
            await move.moveNext('E');
        } else if (event.key == 'a') {
            await move.moveNext('NW');
        } else if (event.key == 'e') {
            await move.moveNext('NE');
        } else if (event.key == 'w') {
            await move.moveNext('SW');
        } else if (event.key == 'c') {
            await move.moveNext('SE');
        }
    });
</script>
